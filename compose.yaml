x-logging: &logging
  driver: json-file
  options: {max-size: 5m, max-file: "3"}

services:
  frproxy:
    image: docker.io/oven/bun:1
    user: root
    restart: unless-stopped
    logging: *logging
    command: ["bun", "/app/daemon.ts"]
    # This host, as the ./frproxy script describes it (src/host.ts sets the host up through these and the mounts below).
    environment: [FRPROXY_HOSTNAME, FRPROXY_DIR, FRPROXY_BIN, FRPROXY_OS, FRPROXY_ARCH, FRPROXY_PATH]
    volumes:
      - state:/state
      - ./src:/app:ro,z
      - ./config:/config:z
      - ./compose.yaml:/host/compose.yaml:ro,z # pins the cloudflared version that frproxy ssh downloads
      - ${FRPROXY_BIN}:${FRPROXY_BIN}          # same path inside, so paths written there are valid on the host
      - ${HOME}/.ssh:/host/ssh

  cloudflared:
    image: docker.io/cloudflare/cloudflared:2026.10.0
    restart: unless-stopped
    network_mode: host
    logging: *logging
    command: ["tunnel", "--no-autoupdate", "run", "--token-file", "/state/token"]
    volumes:
      - state:/state:ro

volumes:
  state:
