x-logging: &logging
  driver: json-file
  options: {max-size: 5m, max-file: "3"}

# The cloudflared containers, one for the named tunnel and one per quick tunnel, are generated from this into
# config/compose.tunnels.yaml (src/quick.ts), which ./cfproxy passes to compose next to this file.
# The version is also what `cfproxy ssh` downloads.
x-cloudflared:
  image: docker.io/cloudflare/cloudflared:2026.10.0
  restart: unless-stopped
  network_mode: host # dials out to Cloudflare; localhost:PORT reaches the host's apps
  logging: *logging

services:
  cfproxy:
    image: docker.io/oven/bun:1
    user: root
    restart: unless-stopped
    network_mode: host # reaches the quick tunnels' metrics (their URLs) on 127.0.0.1
    logging: *logging
    command: ["bun", "/app/daemon.ts"]
    # This host, as the ./cfproxy script describes it (src/host.ts sets the host up through these and the mounts below).
    environment: [CFPROXY_HOSTNAME, CFPROXY_DIR, CFPROXY_BIN, CFPROXY_OS, CFPROXY_ARCH, CFPROXY_PATH, CFPROXY_OWNER]
    volumes:
      - state:/state
      - ./src:/app:ro,z
      - ./config:/config:z
      - .:/host/cfproxy:ro,z                   # compose.yaml's x-cloudflared, for the generated containers and cfproxy ssh
      - ${CFPROXY_BIN}:${CFPROXY_BIN}          # same path inside, so paths written there are valid on the host
      - ${HOME}/.ssh:/host/ssh

volumes:
  state:
